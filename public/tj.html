<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Special Question for Janice 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><text y="24" font-size="24">❤️</text></svg>') 16 16, auto;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-size: 200% 200%;
            animation: gradientShift 10s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .container {
            text-align: center;
            max-width: 90vw;
            padding: 20px;
        }

        /* Countdown Display */
        #countdown {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2em;
            z-index: 999;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease-in;
        }

        /* Video Controls */
        #videoContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        video {
            max-width: 100vw;
            max-height: 100vh;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Fullscreen Button */
        #fullscreenBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.2em;
            z-index: 1003;
            transition: all 0.3s ease;
        }

        #fullscreenBtn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        #questionContainer {
            display: none;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: white;
            font-size: clamp(2em, 5vw, 3em);
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .buttons {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            position: relative;
            min-height: 80px;
        }

        button {
            padding: clamp(15px, 3vw, 20px) clamp(30px, 5vw, 50px);
            font-size: clamp(1.2em, 3vw, 1.5em);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: absolute;
        }

        #yesButton {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            left: 50%;
            transform: translateX(calc(-100% - 10px));
        }

        #yesButton:hover {
            transform: translateX(calc(-100% - 10px)) scale(1.1);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        #noButton {
            background: #e0e0e0;
            color: #666;
            left: 50%;
            transform: translateX(10px);
            transition: none;
        }

        #noButton:hover {
            transform: translateX(10px) scale(0.9);
        }

        #response {
            margin-top: 30px;
            font-size: clamp(1.5em, 4vw, 2em);
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            display: none;
        }

        /* Action Buttons (Screenshot & Share) */
        #actionButtons {
            margin-top: 30px;
            display: none;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .actionBtn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px 30px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.3s ease;
            position: relative;
        }

        .actionBtn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .particle {
            position: absolute;
            font-size: 2em;
            animation: floatParticle 15s infinite;
            opacity: 0.4;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.4;
            }
            90% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-20vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Fireworks */
        .firework {
            position: fixed;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            pointer-events: none;
        }

        @keyframes fireworkExplode {
            0% {
                opacity: 1;
                transform: translate(0, 0);
            }
            100% {
                opacity: 0;
            }
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        @keyframes sparkle {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: scale(1.5) rotate(180deg);
                opacity: 1;
            }
            100% {
                transform: scale(0) rotate(360deg);
                opacity: 0;
            }
        }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            #countdown {
                font-size: 1em;
                padding: 10px 20px;
            }

            h1 {
                margin-bottom: 20px;
            }

            .buttons {
                margin-top: 30px;
            }

            #fullscreenBtn {
                padding: 10px 15px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <!-- Countdown -->
    <div id="countdown"></div>

    <!-- Particles Container -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <div id="videoContainer">
            <video id="valentineVideo" controls playsinline preload="auto">
                <source src="assets/videos/valentine-video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <div id="playButton" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.8); color: white; padding: 30px 60px; border-radius: 50px; font-size: 2em; cursor: pointer; z-index: 1002; backdrop-filter: blur(10px); display: flex; align-items: center; gap: 15px;">
                ▶️ Click to Play
            </div>
            <div id="volumeHint" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.8); color: white; padding: 20px 40px; border-radius: 15px; font-size: 1.5em; z-index: 1002; backdrop-filter: blur(10px); text-align: center;">
                🔊 Turn on sound for the best experience
            </div>
            <button id="fullscreenBtn">⛶ Fullscreen</button>
        </div>

        <div id="questionContainer">
            <h1>Janice, will you be my Valentine? 💕</h1>
            <div class="buttons">
                <button id="yesButton">Yes! 💖</button>
                <button id="noButton">No</button>
            </div>
            <div id="response"></div>
            <div id="actionButtons">
                <button class="actionBtn" id="screenshotBtn">📸 Save this Moment</button>
                <button class="actionBtn" id="shareBtn">💌 Share</button>
            </div>
        </div>
    </div>

    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script>
        // Countdown Timer
        function updateCountdown() {
            // October 9, 2024 at 11:00 PM CST (Chicago time)
            const startDate = new Date('2024-10-09T23:00:00-05:00');
            const now = new Date();
            const diff = now - startDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

            document.getElementById('countdown').innerHTML = `Together for ${days} days, ${hours} hours, ${minutes} minutes 💕`;
        }
        updateCountdown();
        setInterval(updateCountdown, 60000); // Update every minute

        // Create mixed particles (hearts and rose petals)
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particles = ['💕', '💖', '🌹', '🌺', '🌸', '💐'];

            for (let i = 0; i < 25; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.innerHTML = particles[Math.floor(Math.random() * particles.length)];
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.fontSize = (Math.random() * 2 + 1) + 'em';
                particlesContainer.appendChild(particle);
            }
        }
        createParticles();

        // Video controls
        const video = document.getElementById('valentineVideo');
        const playButton = document.getElementById('playButton');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        // Play button
        playButton.onclick = function() {
            video.play();
            playButton.style.display = 'none';
        };

        // Show volume hint when video starts
        video.addEventListener('playing', function() {
            const volumeHint = document.getElementById('volumeHint');
            volumeHint.style.display = 'block';
            setTimeout(() => {
                volumeHint.style.opacity = '0';
                volumeHint.style.transition = 'opacity 1s';
                setTimeout(() => {
                    volumeHint.style.display = 'none';
                }, 1000);
            }, 3000);
        }, { once: true });

        // Fullscreen button
        fullscreenBtn.onclick = function() {
            if (document.fullscreenElement) {
                document.exitFullscreen();
                fullscreenBtn.innerHTML = '⛶ Fullscreen';
            } else {
                document.documentElement.requestFullscreen();
                fullscreenBtn.innerHTML = '✕ Exit Fullscreen';
            }
        };

        // Video ended event
        const videoContainer = document.getElementById('videoContainer');
        const questionContainer = document.getElementById('questionContainer');

        video.addEventListener('ended', function() {
            videoContainer.style.display = 'none';
            questionContainer.style.display = 'block';
        });

        // Button interactions
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');
        const response = document.getElementById('response');
        const actionButtons = document.getElementById('actionButtons');

        yesButton.addEventListener('click', function() {
            response.innerHTML = '🎉 Yay! You made me the happiest! 💕✨<br><br><span style="font-size: 0.6em; font-style: italic;">I promise to make every moment with you magical ✨</span>';
            response.style.display = 'block';
            document.querySelector('.buttons').style.display = 'none';

            // Show action buttons
            setTimeout(() => {
                actionButtons.style.display = 'flex';
            }, 2000);

            // Change background
            document.body.style.background = 'linear-gradient(135deg, #ff6b9d 0%, #c06c84 50%, #6c5b7b 100%)';

            // Heart explosion
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.innerHTML = '❤️';
                    heart.style.position = 'fixed';
                    heart.style.left = '50%';
                    heart.style.top = '50%';
                    heart.style.fontSize = '2em';
                    heart.style.transform = 'translate(-50%, -50%)';
                    heart.style.pointerEvents = 'none';
                    heart.style.zIndex = '9999';

                    const angle = (Math.PI * 2 * i) / 50;
                    const velocity = 200 + Math.random() * 200;
                    const xVel = Math.cos(angle) * velocity;
                    const yVel = Math.sin(angle) * velocity;

                    heart.style.animation = `explode-${i} 2s forwards`;

                    const keyframes = `
                        @keyframes explode-${i} {
                            to {
                                transform: translate(calc(-50% + ${xVel}px), calc(-50% + ${yVel}px)) rotate(${Math.random() * 360}deg) scale(0);
                                opacity: 0;
                            }
                        }
                    `;

                    const styleSheet = document.createElement('style');
                    styleSheet.textContent = keyframes;
                    document.head.appendChild(styleSheet);

                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 2000);
                }, i * 30);
            }

            // Fireworks!
            createFireworks();

            // Confetti
            const colors = ['#ff6b9d', '#ffd93d', '#6bcf7f', '#4d9de0', '#e15554', '#f0a6ca'];
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.style.position = 'fixed';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-10px';
                    confetti.style.width = '10px';
                    confetti.style.height = '10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                    confetti.style.pointerEvents = 'none';
                    confetti.style.zIndex = '9999';
                    confetti.style.animation = `fall ${3 + Math.random() * 2}s linear forwards`;
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 5000);
                }, i * 30);
            }

            // Sparkles
            const sparkleInterval = setInterval(() => {
                const sparkle = document.createElement('div');
                sparkle.innerHTML = '✨';
                sparkle.style.position = 'fixed';
                sparkle.style.left = (30 + Math.random() * 40) + '%';
                sparkle.style.top = (30 + Math.random() * 40) + '%';
                sparkle.style.fontSize = '1.5em';
                sparkle.style.pointerEvents = 'none';
                sparkle.style.zIndex = '9999';
                sparkle.style.animation = 'sparkle 1s forwards';
                document.body.appendChild(sparkle);

                setTimeout(() => sparkle.remove(), 1000);
            }, 300);

            // Stop sparkles after 10 seconds
            setTimeout(() => clearInterval(sparkleInterval), 10000);
        });

        // Fireworks function
        function createFireworks() {
            const colors = ['#ff0000', '#ff7f00', '#ffff00', '#00ff00', '#0000ff', '#4b0082', '#9400d3'];

            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const x = 20 + Math.random() * 60;
                    const y = 20 + Math.random() * 60;

                    for (let j = 0; j < 30; j++) {
                        const firework = document.createElement('div');
                        firework.className = 'firework';
                        firework.style.left = x + '%';
                        firework.style.top = y + '%';
                        firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

                        const angle = (Math.PI * 2 * j) / 30;
                        const velocity = 100 + Math.random() * 100;
                        const xVel = Math.cos(angle) * velocity;
                        const yVel = Math.sin(angle) * velocity;

                        firework.style.animation = `fireworkExplode 1s ease-out forwards`;
                        firework.style.transform = `translate(${xVel}px, ${yVel}px)`;

                        document.body.appendChild(firework);
                        setTimeout(() => firework.remove(), 1000);
                    }
                }, i * 800);
            }
        }

        // No button runs away
        noButton.addEventListener('mouseenter', function() {
            const maxX = window.innerWidth - noButton.offsetWidth - 20;
            const maxY = window.innerHeight - noButton.offsetHeight - 20;

            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            noButton.style.position = 'fixed';
            noButton.style.left = randomX + 'px';
            noButton.style.top = randomY + 'px';
            noButton.style.transform = 'none';
        });

        // Screenshot function
        document.getElementById('screenshotBtn').onclick = function() {
            // Get elements
            const actionButtons = document.getElementById('actionButtons');
            const countdown = document.getElementById('countdown');
            const questionContainer = document.getElementById('questionContainer');

            // Hide action buttons
            actionButtons.style.display = 'none';

            // Create a wrapper div with all content for screenshot
            const screenshotWrapper = document.createElement('div');
            screenshotWrapper.style.position = 'relative';
            screenshotWrapper.style.width = '100vw';
            screenshotWrapper.style.height = '100vh';
            screenshotWrapper.style.background = 'linear-gradient(135deg, #ff6b9d 0%, #c06c84 50%, #6c5b7b 100%)';
            screenshotWrapper.style.display = 'flex';
            screenshotWrapper.style.flexDirection = 'column';
            screenshotWrapper.style.justifyContent = 'center';
            screenshotWrapper.style.alignItems = 'center';
            screenshotWrapper.style.padding = '40px';
            screenshotWrapper.style.boxSizing = 'border-box';

            // Clone countdown
            const countdownClone = countdown.cloneNode(true);
            countdownClone.style.position = 'relative';
            countdownClone.style.top = 'auto';
            countdownClone.style.left = 'auto';
            countdownClone.style.transform = 'none';
            countdownClone.style.marginBottom = '40px';

            // Clone question content
            const questionClone = questionContainer.cloneNode(true);
            questionClone.style.display = 'block';
            questionClone.style.position = 'relative';

            screenshotWrapper.appendChild(countdownClone);
            screenshotWrapper.appendChild(questionClone);

            // Temporarily add to body (hidden)
            screenshotWrapper.style.position = 'fixed';
            screenshotWrapper.style.top = '0';
            screenshotWrapper.style.left = '0';
            screenshotWrapper.style.zIndex = '-9999';
            document.body.appendChild(screenshotWrapper);

            // Wait and capture
            setTimeout(() => {
                html2canvas(screenshotWrapper, {
                    backgroundColor: null,
                    scale: 2,
                    logging: false,
                    width: window.innerWidth,
                    height: window.innerHeight
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'our-special-moment.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    // Cleanup
                    screenshotWrapper.remove();
                    actionButtons.style.display = 'flex';
                });
            }, 500);
        };

        // Share function
        document.getElementById('shareBtn').onclick = function() {
            if (navigator.share) {
                navigator.share({
                    title: 'Our Special Moment 💕',
                    text: 'She said YES! 🎉',
                    url: window.location.href
                }).catch(err => console.log('Error sharing:', err));
            } else {
                // Fallback: copy to clipboard
                navigator.clipboard.writeText(window.location.href);
                const btn = document.getElementById('shareBtn');
                btn.innerHTML = '✓ Link Copied!';
                setTimeout(() => {
                    btn.innerHTML = '💌 Share';
                }, 2000);
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question for Janice 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 20px;
        }

        #videoContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        #volumeHint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 1.5em;
            z-index: 1001;
            animation: fadeInOut 4s ease-in-out forwards;
            pointer-events: none;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            15% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            85% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
        }

        #questionContainer {
            display: none;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: white;
            font-size: 3em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .buttons {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            position: relative;
            min-height: 80px;
        }

        button {
            padding: 20px 50px;
            font-size: 1.5em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: absolute;
        }

        #yesButton {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            left: 50%;
            transform: translateX(calc(-100% - 10px));
        }

        #yesButton:hover {
            transform: translateX(calc(-100% - 10px)) scale(1.1);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        #noButton {
            background: #e0e0e0;
            color: #666;
            left: 50%;
            transform: translateX(10px);
            transition: none;
        }

        #noButton:hover {
            transform: translateX(10px) scale(0.9);
        }

        #response {
            margin-top: 30px;
            font-size: 2em;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            display: none;
        }

        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .heart {
            position: absolute;
            font-size: 2em;
            animation: float 10s infinite;
            opacity: 0.3;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        @keyframes sparkle {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: scale(1.5) rotate(180deg);
                opacity: 1;
            }
            100% {
                transform: scale(0) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>

    <div class="container">
        <div id="videoContainer">
            <video id="valentineVideo" autoplay muted controls playsinline preload="auto">
                <source src="assets/videos/valentine-video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <div id="volumeHint" style="display: none;">
                🔊 Turn on sound for the best experience
            </div>
        </div>

        <div id="questionContainer">
            <h1>Janice, will you be my Valentine? 💕</h1>
            <div class="buttons">
                <button id="yesButton">Yes! 💖</button>
                <button id="noButton">No</button>
            </div>
            <div id="response"></div>
        </div>
    </div>

    <script>
        // Create floating hearts background
        function createHearts() {
            const heartsContainer = document.getElementById('hearts');
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '💕';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 10 + 's';
                heart.style.fontSize = (Math.random() * 2 + 1) + 'em';
                heartsContainer.appendChild(heart);
            }
        }

        createHearts();

        // Ensure video autoplays
        const video = document.getElementById('valentineVideo');
        const volumeHint = document.getElementById('volumeHint');

        // Wait for video to be loaded before attempting to play
        let playPromise;
        if (video.readyState >= 3) {
            // Video is already loaded, play immediately
            playPromise = video.play();
        } else {
            // Wait for video to load first
            video.addEventListener('loadeddata', function() {
                video.play();
            }, { once: true });
        }

        // Show volume hint when video actually starts playing
        video.addEventListener('playing', function() {
            volumeHint.style.display = 'block';
            setTimeout(() => {
                if (volumeHint) {
                    volumeHint.remove();
                }
            }, 4000);

            // Unmute on first user interaction
            let hasUnmuted = false;
            function unmuteVideo() {
                if (!hasUnmuted && !video.muted) {
                    hasUnmuted = true;
                    return;
                }
                if (!hasUnmuted) {
                    video.muted = false;
                    hasUnmuted = true;
                    console.log('Video unmuted after user interaction');
                    // Remove all listeners after unmuting
                    document.removeEventListener('click', unmuteVideo);
                    document.removeEventListener('touchstart', unmuteVideo);
                    document.removeEventListener('mousemove', unmuteVideo);
                    document.removeEventListener('scroll', unmuteVideo);
                    document.removeEventListener('keydown', unmuteVideo);
                }
            }

            document.addEventListener('click', unmuteVideo, { once: false });
            document.addEventListener('touchstart', unmuteVideo, { once: false });
            document.addEventListener('mousemove', unmuteVideo, { once: false });
            document.addEventListener('scroll', unmuteVideo, { once: false });
            document.addEventListener('keydown', unmuteVideo, { once: false });
        }, { once: true });

        if (playPromise !== undefined && playPromise !== null) {
            playPromise.then(() => {
                // Autoplay started successfully
                console.log('Video is playing');
            }).catch(error => {
                // Autoplay was prevented, show a play button overlay
                console.log('Autoplay prevented:', error);
                showPlayButton();
            });
        }

        function showPlayButton() {
            const playButton = document.createElement('div');
            playButton.innerHTML = '▶️ Click to Play';
            playButton.style.position = 'fixed';
            playButton.style.top = '50%';
            playButton.style.left = '50%';
            playButton.style.transform = 'translate(-50%, -50%)';
            playButton.style.background = 'rgba(0, 0, 0, 0.8)';
            playButton.style.color = 'white';
            playButton.style.padding = '30px 60px';
            playButton.style.borderRadius = '50px';
            playButton.style.fontSize = '2em';
            playButton.style.cursor = 'pointer';
            playButton.style.zIndex = '1002';
            playButton.style.backdropFilter = 'blur(10px)';

            playButton.onclick = function() {
                video.play();
                playButton.remove();
            };

            document.body.appendChild(playButton);
        }

        // Video ended event
        const videoContainer = document.getElementById('videoContainer');
        const questionContainer = document.getElementById('questionContainer');

        video.addEventListener('ended', function() {
            videoContainer.style.display = 'none';
            questionContainer.style.display = 'block';
        });

        // Button interactions
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');
        const response = document.getElementById('response');

        yesButton.addEventListener('click', function() {
            response.innerHTML = '🎉 Yay! You made me the happiest! 💕✨<br><br><span style="font-size: 0.6em; font-style: italic;">I promise to make every moment with you magical ✨</span>';
            response.style.display = 'block';
            document.querySelector('.buttons').style.display = 'none';

            // Change background to romantic colors
            document.body.style.background = 'linear-gradient(135deg, #ff6b9d 0%, #c06c84 50%, #6c5b7b 100%)';

            // Create heart explosion
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.innerHTML = '❤️';
                    heart.style.position = 'fixed';
                    heart.style.left = '50%';
                    heart.style.top = '50%';
                    heart.style.fontSize = '2em';
                    heart.style.transform = 'translate(-50%, -50%)';
                    heart.style.pointerEvents = 'none';
                    heart.style.zIndex = '9999';

                    const angle = (Math.PI * 2 * i) / 50;
                    const velocity = 200 + Math.random() * 200;
                    const xVel = Math.cos(angle) * velocity;
                    const yVel = Math.sin(angle) * velocity;

                    heart.style.animation = `explode-${i} 2s forwards`;

                    const keyframes = `
                        @keyframes explode-${i} {
                            to {
                                transform: translate(calc(-50% + ${xVel}px), calc(-50% + ${yVel}px)) rotate(${Math.random() * 360}deg) scale(0);
                                opacity: 0;
                            }
                        }
                    `;

                    const styleSheet = document.createElement('style');
                    styleSheet.textContent = keyframes;
                    document.head.appendChild(styleSheet);

                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 2000);
                }, i * 30);
            }

            // Create confetti effect
            const colors = ['#ff6b9d', '#ffd93d', '#6bcf7f', '#4d9de0', '#e15554', '#f0a6ca'];
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.style.position = 'fixed';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-10px';
                    confetti.style.width = '10px';
                    confetti.style.height = '10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                    confetti.style.pointerEvents = 'none';
                    confetti.style.zIndex = '9999';
                    confetti.style.animation = `fall ${3 + Math.random() * 2}s linear forwards`;
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 5000);
                }, i * 30);
            }

            // Add sparkles around the message
            setInterval(() => {
                const sparkle = document.createElement('div');
                sparkle.innerHTML = '✨';
                sparkle.style.position = 'fixed';
                sparkle.style.left = (30 + Math.random() * 40) + '%';
                sparkle.style.top = (30 + Math.random() * 40) + '%';
                sparkle.style.fontSize = '1.5em';
                sparkle.style.pointerEvents = 'none';
                sparkle.style.zIndex = '9999';
                sparkle.style.animation = 'sparkle 1s forwards';
                document.body.appendChild(sparkle);

                setTimeout(() => sparkle.remove(), 1000);
            }, 300);
        });

        // Make the "No" button run away
        noButton.addEventListener('mouseenter', function() {
            const maxX = window.innerWidth - noButton.offsetWidth - 20;
            const maxY = window.innerHeight - noButton.offsetHeight - 20;

            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            noButton.style.position = 'fixed';
            noButton.style.left = randomX + 'px';
            noButton.style.top = randomY + 'px';
            noButton.style.transform = 'none';
        });
    </script>
</body>
</html>
